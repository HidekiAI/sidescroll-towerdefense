[package]
name = "sstd-editor-bridge"
version = "0.1.0"
edition = "2021"
description = "Godot 4 GDExtension bridge — exposes sstd-core to GDScript"

[lib]
crate-type = ["cdylib"]
name = "sstd_editor_bridge"

[dependencies]
sstd-core = { path = "../sstd-core" }
sstd-grpc = { path = "../sstd-grpc" }
godot = { version = "0.5", features = ["api-4-4"] }
tokio = { version = "1", features = ["sync"] }
serde_json = "1"
base64 = "0.22"
