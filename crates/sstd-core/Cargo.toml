[package]
name = "sstd-core"
version = "0.1.0"
edition = "2021"
description = "Shared data model and physics engine for SSTD Editor and Game"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
